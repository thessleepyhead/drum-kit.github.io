<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Drum Kit</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Arvo" rel="stylesheet">
</head>

<body>

  <h1 id="title">Drum 🥁 Kit</h1>
  <p id="starter-note">💡 Pro-Tip: Turn up your volume and hit <strong> KLKAJ KLKAJ</strong>!</p>
  <div class="set">
    <button class="w drum">w</button>
    <button class="a drum">a</button>
    <button class="s drum">s</button>
    <button class="d drum">d</button>
    <button class="j drum">j</button>
    <button class="k drum">k</button>
    <button class="l drum">l</button>
  </div>
  <div class="controls">
  <button id="record-btn" class="control-btn">🔴 Record</button>
  <button id="play-btn" class="control-btn" disabled>▶️ Play Recording</button>
 </div>


  <footer>
    Groove with Me❤️.
  </footer> 
  <script src="index.js" charset="utf-8"></script>
</body>

</html>
